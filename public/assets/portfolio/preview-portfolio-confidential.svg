<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <rect width="900" height="600" fill="#18181e" />

  <!-- ambient accent glow -->
  <circle cx="660" cy="150" r="220" fill="rgb(216, 62, 62)" opacity="0.12" />

  <!-- abstract feed cards (left) -->
  <g opacity="0.9">
    <rect x="90" y="120" width="300" height="90" rx="4" fill="#232330" />
    <rect x="110" y="140" width="140" height="14" rx="2" fill="#3a3a48" />
    <rect x="110" y="164" width="220" height="10" rx="2" fill="#2c2c39" />
    <rect x="110" y="182" width="180" height="10" rx="2" fill="#2c2c39" />

    <rect x="90" y="228" width="300" height="90" rx="4" fill="#232330" />
    <rect x="110" y="248" width="100" height="14" rx="2" fill="rgb(216, 62, 62)" opacity="0.6" />
    <rect x="110" y="272" width="240" height="10" rx="2" fill="#2c2c39" />
    <rect x="110" y="290" width="150" height="10" rx="2" fill="#2c2c39" />

    <rect x="90" y="336" width="300" height="90" rx="4" fill="#232330" />
    <rect x="110" y="356" width="120" height="14" rx="2" fill="#3a3a48" />
    <rect x="110" y="380" width="200" height="10" rx="2" fill="#2c2c39" />
    <rect x="110" y="398" width="170" height="10" rx="2" fill="#2c2c39" />
  </g>

  <!-- phone mockup (right) -->
  <g>
    <rect x="560" y="70" width="240" height="460" rx="32" fill="#232330" stroke="#3a3a48" stroke-width="2" />
    <rect x="578" y="104" width="204" height="392" rx="6" fill="#18181e" />

    <!-- video/hero block -->
    <rect x="578" y="104" width="204" height="140" rx="6" fill="#2c2c39" />
    <polygon points="668,150 668,198 710,174" fill="rgb(216, 62, 62)" />

    <!-- stat row -->
    <rect x="590" y="256" width="50" height="10" rx="2" fill="#3a3a48" />
    <rect x="650" y="256" width="50" height="10" rx="2" fill="#3a3a48" />
    <rect x="710" y="256" width="50" height="10" rx="2" fill="#3a3a48" />

    <!-- list rows -->
    <rect x="590" y="286" width="192" height="52" rx="4" fill="#232330" />
    <rect x="590" y="346" width="192" height="52" rx="4" fill="#232330" />
    <rect x="590" y="406" width="192" height="52" rx="4" fill="#232330" />

    <!-- nav bar -->
    <rect x="578" y="472" width="204" height="24" rx="4" fill="#2c2c39" />
    <circle cx="620" cy="484" r="5" fill="rgb(216, 62, 62)" />
    <circle cx="660" cy="484" r="5" fill="#3a3a48" />
    <circle cx="700" cy="484" r="5" fill="#3a3a48" />
    <circle cx="740" cy="484" r="5" fill="#3a3a48" />
  </g>

  <!-- confidentiality badge -->
  <g transform="translate(90 460)">
    <rect width="150" height="40" rx="20" fill="#232330" stroke="#3a3a48" />
    <g transform="translate(20 12)" fill="none" stroke="#c9c9d1" stroke-width="1.6">
      <rect x="0" y="6" width="14" height="10" rx="2" />
      <path d="M2.5 6 V3.5 a4.5 4 0 0 1 9 0 V6" />
    </g>
    <text x="46" y="26" fill="#c9c9d1" font-family="sans-serif" font-size="13" letter-spacing="0.3">
      NDA project
    </text>
  </g>
